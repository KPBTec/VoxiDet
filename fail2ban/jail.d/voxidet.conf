# VoxiDet — jails de fail2ban (plantilla). Copiado por deploy.sh a
# /etc/fail2ban/jail.d/voxidet.conf, sustituyendo el puerto SSH (sed).
#
# NO editar el archivo en /etc directamente.

[DEFAULT]
# nftables, no iptables — el proyecto ya usa nftables para el firewall
# (nftables/nftables.conf). fail2ban con banaction=nftables-* crea su propio
# set independiente y no toca la tabla `filter`, sin conflicto.
banaction          = nftables-allports
banaction_allports = nftables-allports

[sshd]
# Jail estándar de fail2ban (filter.d/sshd.conf ya viene incluido) — solo se
# personaliza el puerto (detectado igual que en nftables.conf) y el backend:
# backend=auto falla en Debian/Ubuntu moderno cuando no existe
# /var/log/auth.log (todo va a journald) — "Have not found any log file for
# sshd jail". Se fuerza systemd/journald explícito en vez de auto-detectar.
enabled      = true
port         = __SSH_PORT__
backend      = systemd
journalmatch = _SYSTEMD_UNIT=__SSH_SERVICE__
maxretry     = 5
findtime     = 600
bantime      = 3600

[voxidet-security]
# Rechazos de la app (API key inválida, IP no autorizada, login fallido,
# User-Agent de scanner) — nunca los dispara un cliente legítimo, por eso el
# umbral es agresivo (10 en 1 minuto). Deliberadamente NO cubre rate_limit
# (ver nota en filter.d/voxidet-security.conf).
enabled   = true
filter    = voxidet-security
logpath   = /opt/voxidet/logs/security.log
backend   = auto
maxretry  = 10
findtime  = 60
bantime   = 3600
