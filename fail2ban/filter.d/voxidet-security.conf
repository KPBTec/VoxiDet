# VoxiDet — filtro para rechazos de seguridad de la app (SecurityMiddleware,
# deps.py, panel admin). Copiado por deploy.sh a
# /etc/fail2ban/filter.d/voxidet-security.conf
#
# Solo matchea reason=blocked_ua / invalid_api_key / ip_not_allowed /
# invalid_admin_key / login_failed — señales que un cliente legítimo NUNCA
# dispara (una API key válida nunca falla). A propósito NO incluye
# reason=rate_limit: un dialer de alto volumen puede exceder el rate limit
# en tráfico normal, banearlo por eso sería un auto-DoS.
[Definition]
failregex = ^.*SECURITY_REJECT ip=<HOST> reason=(blocked_ua|invalid_api_key|ip_not_allowed|invalid_admin_key|login_failed)\b
ignoreregex =
