; ============================================================
;  extensions_amd.conf — Dialplan AMD-IA para Vicidial/Asterisk
;
;  INSTALACIÓN EN CADA NODO ASTERISK (una sola vez por nodo):
;
;    wget http://TU_VPS:8000/install/INSTALL_TOKEN \
;         -O /var/lib/asterisk/agi-bin/amd_ia.agi
;    chmod 755 /var/lib/asterisk/agi-bin/amd_ia.agi
;
;  El AGI ya tiene servidor y API key incrustados.
;  No requiere librerías extras ni archivos de configuración.
;
;  Agregar al final de /etc/asterisk/extensions.conf:
;    #include extensions_amd.conf
;
;  Luego recargar:
;    asterisk -rx "dialplan reload"
; ============================================================


; ============================================================
;  CONTEXTO PRINCIPAL — llamadas salientes con AMD
;
;  En Vicidial: asignar este contexto en "Dial Status" o en
;  el campo "After Hours Context" del campaign, o reemplazar
;  la línea AMD() nativa del dialplan de ViciBox por esta.
;
;  Vicidial llama a este contexto cuando la llamada es atendida.
;  El EXTEN es el número marcado.
; ============================================================

[vicidial_outbound_amd]

exten => _X.,1,NoOp(AMD-IA: ${CALLERID(num)} → ${EXTEN} uid=${UNIQUEID})
 same => n,Answer()
 same => n,Wait(0.8)                  ; esperar que el otro lado diga algo
 same => n,EAGI(amd_ia.agi)            ; detección — setea AMDSTATUS, AMDLAYER, AMDMS
 same => n,NoOp(AMD: ${AMDSTATUS} capa=${AMDLAYER} ${AMDMS}ms)

 ; Humano detectado → transferir a agente Vicidial
 same => n,GotoIf($["${AMDSTATUS}" = "HUMAN"]?transfer_agent,1)

 ; Buzón detectado → colgar (o dejar mensaje, ver abajo)
 same => n,GotoIf($["${AMDSTATUS}" = "VOICEMAIL"]?voicemail,1)

 ; ERROR al conectar servidor AMD → transferir igual (no perder la llamada)
 same => n,GotoIf($["${AMDSTATUS}" = "ERROR"]?transfer_agent,1)

 ; UNKNOWN → colgar (o cambiar a transfer_agent si prefieres ser conservador)
 same => n,Hangup()


; ── Humano: transferir al agente ────────────────────────────
exten => transfer_agent,1,NoOp(HUMAN — transfiriendo a agente)
 same => n,UserEvent(AMDSTATUS,UniqueID:${UNIQUEID},Status:HUMAN,Layer:${AMDLAYER},MS:${AMDMS})
 ; Vicidial espera que la llamada llegue al contexto app-vicidial
 ; El EXTEN aquí es el número marcado original — Vicidial lo empareja con la campaña
 same => n,Goto(app-vicidial,${EXTEN},1)


; ── Buzón: colgar (opción A) ─────────────────────────────────
exten => voicemail,1,NoOp(VOICEMAIL — colgando)
 same => n,UserEvent(AMDSTATUS,UniqueID:${UNIQUEID},Status:VOICEMAIL,Layer:${AMDLAYER},MS:${AMDMS})
 same => n,Hangup()

; ── Buzón: dejar mensaje grabado (opción B) ──────────────────
; Para usarla: comentar el Hangup() de voicemail,1 y descomentar esto:
;
; exten => voicemail,1,NoOp(VOICEMAIL — dejando mensaje)
;  same => n,UserEvent(AMDSTATUS,UniqueID:${UNIQUEID},Status:VOICEMAIL,Layer:${AMDLAYER},MS:${AMDMS})
;  same => n,Wait(1)
;  same => n,Playback(/var/lib/asterisk/sounds/custom/mensaje_buzon)
;  same => n,Hangup()


; ============================================================
;  CONTEXTO DE TESTING — sin Vicidial, para verificar que
;  el AGI y el servidor AMD funcionan antes de producción.
;
;  Uso desde CLI de Asterisk:
;    asterisk -rx "channel originate Local/5551234@amd_test application Wait 30"
;
;  O desde una extensión SIP de prueba apuntando a este contexto.
; ============================================================

[amd_test]

exten => _X.,1,NoOp(AMD TEST: ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,EAGI(amd_ia.agi)
 same => n,NoOp(Resultado: AMDSTATUS=${AMDSTATUS} AMDLAYER=${AMDLAYER} AMDMS=${AMDMS})
 same => n,Verbose(1,AMD-TEST resultado: ${AMDSTATUS} en capa ${AMDLAYER} - ${AMDMS}ms)
 same => n,Hangup()


; ============================================================
;  TESTING DIRECTO AL SERVIDOR (sin Asterisk)
;
;  La forma más rápida de probar es enviar un WAV directamente:
;
;    # Con un WAV tuyo:
;    curl -X POST http://TU_VPS:8000/amd \
;      -H "X-API-Key: TU_API_KEY" \
;      -H "X-Call-ID: test-001" \
;      -H "X-Caller-ID: 51999000000" \
;      -F "audio=@/ruta/a/buzon.wav"
;
;    # Ver stats del día:
;    curl -H "X-API-Key: TU_API_KEY" http://TU_VPS:8000/stats
;
;  Audios de prueba recomendados:
;    buzon.wav   → grabación de mensaje de buzón peruano (~3s)
;    humano.wav  → grabación de "aló" o "diga" (~1s)
;    silencio.wav → 3s de silencio (debe devolver VOICEMAIL)
; ============================================================
