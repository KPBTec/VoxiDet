# =============================================================================
# VoxiDet — Metadatos del release
#
# Para nuevo release: incrementar PLATFORM_VERSION y agregar entrada en
# CHANGELOG.md. deploy.sh lo lee para mostrar la versión en el resumen final;
# el panel admin lo lee para mostrar la versión en el sidebar.
# =============================================================================

# Nombre completo (aparece en banners, DB, emails)
PLATFORM_NAME="VoxiDet"

# Nombre corto (usado en prompts, etiquetas)
PLATFORM_SHORT="VXID"

# Versión actual — incrementar en cada release
PLATFORM_VERSION="1.23.1"

# Valores por defecto sugeridos al instalar
DEFAULT_DOMAIN="voxidet.kpbtec.com"
DEFAULT_WEB_PORT="8000"
DEFAULT_MGMT_IP="10.100.254.1"

# Soporte (informativo — aparece en el resumen final)
PLATFORM_SUPPORT_URL="https://voxidet.kpbtec.com"
