#!/usr/sbin/nft -f
# VoxiDet — nftables base (plantilla)
# deploy.sh sustituye los placeholders (sed) y copia el resultado a
# /etc/nftables.conf. NO editar el archivo en /etc directamente.
#
# Una sola tabla (mismo patrón que VoxiKam) — el include de abajo trae un
# FRAGMENTO de reglas (sets + líneas sueltas), no una tabla aparte, así que
# puede ir dentro del chain sin romper sintaxis.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept

        # SSH abierto a cualquier IP (decisión explícita, sin restricción de
        # origen) + puerto web/API — siempre garantizados antes de que las
        # reglas dinámicas de abajo decidan el resto.
        tcp dport __SSH_PORT__ accept
        tcp dport __WEB_PORT__ accept

        # Reglas dinámicas (clientes/IPs del panel admin → Firewall)
        include "/etc/nftables.d/voxidet.nft"

        # ICMP básico
        icmp type echo-request limit rate 5/second accept
        icmp type { echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
